name: Godot validation
on:
  push:
    branches: [main, feat/godot-rpg-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate PNG atlas dimensions and transparency
        run: python3 tools/validate_sprite_atlases.py
      - name: Import project with Godot 4.7.2
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --editor --import --quit
      - name: Test spell casting, 8-way sprites and enemy damage
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/magic_smoke.gd
      - name: Test dodge HUD and unique relic inventory
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/dodge_hud.gd
      - name: Test enemy health bars, damage numbers and warnings
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/combat_feedback.gd
      - name: Test player dodge and invulnerability
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/player_dodge.gd
      - name: Test world collisions and collision masks
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/world_collisions.gd
      - name: Test obstacle steering and stable detour
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/enemy_steering.gd
      - name: Test enemy AI state transitions
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/slime_ai.gd
      - name: Test wolf telegraphed pounce and cooldown
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/wolf_pounce.gd
      - name: Test forest shaman and enemy projectile
