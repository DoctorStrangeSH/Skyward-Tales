name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_IMAGE: barichello/godot-ci:4.7.2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ hashFiles('assets/**', 'project.godot') }}
          restore-keys: godot-import-

      - name: Validate PNG atlas dimensions and transparency
        run: python3 tools/validate_sprite_atlases.py

      - name: Run Godot import, all tests and smoke run
        run: |
          docker run --rm -v "${PWD}:/project" -w /project "$GODOT_IMAGE" bash -c '
            set -u
            godot --headless --path . --editor --import --quit || exit 1
            failed=()
            for test in tests/*.gd; do
              # Fresh user:// directory for every test so saves cannot leak between tests.
              export HOME="$(mktemp -d)"
              if godot --headless --path . --script "res://${test}" > "/tmp/$(basename "$test").log" 2>&1 && ! grep -q "SCRIPT ERROR" "/tmp/$(basename "$test").log"; then
                echo "ok    ${test}"
              else
                echo "FAIL  ${test}"
                cat "/tmp/$(basename "$test").log"
                failed+=("${test}")
              fi
            done
            # Smoke run: the title screen lives 120 frames and quits cleanly —
            # no script errors, no leaked objects or resources.
            export HOME="$(mktemp -d)"
            godot --headless --path . --script res://tools/smoke_run.gd > /tmp/smoke.log 2>&1 || failed+=("smoke run")
            cat /tmp/smoke.log
            if grep -qE "SCRIPT ERROR|leaked at exit|still in use at exit" /tmp/smoke.log; then failed+=("smoke run: errors or leaks"); fi
            # Windowed tests (real mouse clicks on the GUI) under a virtual display.
            export HOME="$(mktemp -d)"
            if command -v xvfb-run > /dev/null || (apt-get update -qq > /dev/null 2>&1 && apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null 2>&1); then
              timeout 180 xvfb-run -a godot --path . --rendering-driver opengl3 --script res://tests/dialogue_click.gd > /tmp/click.log 2>&1
              cat /tmp/click.log | tail -5
              if grep -q "DIALOGUE CLICK OK" /tmp/click.log; then echo "ok    windowed dialogue_click"; else failed+=("windowed dialogue_click"); fi
            else
              echo "::warning::xvfb is not available: windowed GUI tests were NOT run"
            fi
            if [ "${#failed[@]}" -gt 0 ]; then
              echo "Failed: ${failed[*]}"
              exit 1
            fi
          '

      - name: Let the cache step read the import folder
        if: always()
        run: sudo chown -R "$USER" .godot || true
