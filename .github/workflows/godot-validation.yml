name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_IMAGE: barichello/godot-ci:4.7.2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate PNG atlas dimensions and transparency
        run: python3 tools/validate_sprite_atlases.py

      - name: Run Godot import, all tests and smoke run
        run: |
          docker run --rm -v "${PWD}:/project" -w /project "$GODOT_IMAGE" bash -c '
            set -u
            godot --headless --path . --editor --import --quit || exit 1
            failed=()
            for test in tests/*.gd; do
              # Fresh user:// directory for every test so saves cannot leak between tests.
              export HOME="$(mktemp -d)"
              if godot --headless --path . --script "res://${test}" > "/tmp/$(basename "$test").log" 2>&1; then
                echo "ok    ${test}"
              else
                echo "FAIL  ${test}"
                cat "/tmp/$(basename "$test").log"
                failed+=("${test}")
              fi
            done
            export HOME="$(mktemp -d)"
            godot --headless --path . --quit-after 120 || failed+=("smoke run")
            if [ "${#failed[@]}" -gt 0 ]; then
              echo "Failed: ${failed[*]}"
              exit 1
            fi
          '
