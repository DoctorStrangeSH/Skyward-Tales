name: Godot validation
on:
  push:
    branches: [main, feat/godot-rpg-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate PNG atlas dimensions and transparency
        run: python3 tools/validate_sprite_atlases.py
      - name: Import project with Godot 4.7.2
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --editor --import --quit
      - name: Test spell casting, 8-way sprites and enemy damage
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/magic_smoke.gd
      - name: Test dodge HUD and unique relic inventory
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/dodge_hud.gd
      - name: Test enemy health bars, damage numbers and warnings
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/combat_feedback.gd
      - name: Test player dodge and invulnerability
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/player_dodge.gd
      - name: Test world collisions and collision masks
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/world_collisions.gd
      - name: Test obstacle steering and stable detour
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/enemy_steering.gd
      - name: Test enemy AI state transitions
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/slime_ai.gd
      - name: Test wolf telegraphed pounce and cooldown
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/wolf_pounce.gd
      - name: Test forest shaman and enemy projectile
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/forest_shaman.gd
      - name: Test grove guardian boss phases and victory
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/grove_guardian.gd
      - name: Test fire burning damage and persistence
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/fire_burning.gd
      - name: Test ice magic and slow expiration
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/frost_magic.gd
      - name: Test chain lightning targeting and diminishing damage
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/chain_lightning.gd
      - name: Test combat HUD spell selection and cooldown
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/combat_hud.gd
      - name: Test loot and consumable inventory
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/loot_inventory.gd
      - name: Test inventory panel and item interaction
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/inventory_window.gd
      - name: Test equipment bonuses and spell damage
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/equipment.gd
      - name: Test equipment slots and removal
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/equipment_unequip.gd
      - name: Test save/load of quest, equipment and world
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/save_load.gd
      - name: Test player death, defeat screen and recovery
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/death_flow.gd
      - name: Test level-up talent choices and persistence
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/level_up_talents.gd
      - name: Test title menu and pause controls
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/title_menu.gd
      - name: Test region travel and grove quest
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --script res://tests/regions_and_grove_quest.gd
      - name: Headless gameplay smoke test
        run: |
          docker run --rm -v "${PWD}:/project" -w /project barichello/godot-ci:4.7.2 godot --headless --path . --quit-after 120
