name: Build game

# Builds Windows and Linux versions. Every push to main leaves a downloadable
# artifact on the run page: the Windows installer (SkywardTales-Setup.exe) and
# zip archives for Windows and Linux. A Release is published either by pushing
# a tag like v0.3.0 or by running the workflow manually with "release_tag".

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Опубликовать релиз с этим тегом (например v0.3.0). Пусто — только сборка."
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GODOT_IMAGE: barichello/godot-ci:4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The Godot import cache: unchanged art is not imported again.
      - uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ hashFiles('assets/**', 'project.godot') }}
          restore-keys: godot-import-

      - name: Export Windows and Linux builds
        run: |
          docker run --rm -v "${PWD}:/project" -w /project "$GODOT_IMAGE" bash -c '
            set -eu
            mkdir -p build/windows build/linux
            godot --headless --path . --editor --import --quit
            godot --headless --path . --export-release "Windows Desktop" build/windows/SkywardTales.exe
            godot --headless --path . --export-release "Linux" build/linux/SkywardTales.x86_64
            # The stock template, to check below that the game icon replaced Godot'"'"'s.
            find / -name "windows_release_x86_64.exe" -path "*export_templates*" 2>/dev/null | head -1 | xargs -r -I{} cp {} build/stock_template.exe
          '
          sudo chown -R "$USER" build .godot
          ls -la build/windows build/linux
          test -s build/windows/SkywardTales.exe
          test -s build/linux/SkywardTales.x86_64

      - name: The game icon is inside the .exe
        run: |
          sudo apt-get install -y -qq icoutils > /dev/null
          wrestool -x -t14 build/windows/SkywardTales.exe > game_icon.ico
          test -s game_icon.ico
          if [ -s build/stock_template.exe ]; then
            wrestool -x -t14 build/stock_template.exe > stock_icon.ico || true
            if cmp -s game_icon.ico stock_icon.ico; then echo "The .exe still has Godot's icon"; exit 1; fi
          fi
          rm -f build/stock_template.exe game_icon.ico stock_icon.ico

      - name: Smoke-run the exported Linux build
        run: |
          chmod +x build/linux/SkywardTales.x86_64
          export HOME="$(mktemp -d)"
          timeout 120 build/linux/SkywardTales.x86_64 --headless --quit-after 300 -- --smoke 2>&1 | tee smoke.log
          # Missing data or textures in the export show up as these warnings.
          if grep -E "Не найден файл|Нет текстуры|Parse Error|SCRIPT ERROR|Aborting" smoke.log; then exit 1; fi
          grep -q "Godot Engine" smoke.log

      - name: Package
        run: |
          cp docs/PLAYING.md build/windows/README.txt
          cp docs/PLAYING.md build/linux/README.txt
          (cd build/windows && zip -9 -r ../SkywardTales-windows.zip .)
          (cd build/linux && chmod +x SkywardTales.x86_64 && zip -9 -r ../SkywardTales-linux.zip .)

      - name: Windows installer
        run: |
          sudo apt-get install -y -qq nsis > /dev/null
          version="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot).${{ github.run_number }}"
          makensis -V2 -NOCD -DVERSION="$version" -DSRC=build/windows -DOUT=build/SkywardTales-Setup.exe installer/skyward_tales.nsi
          test -s build/SkywardTales-Setup.exe
          ls -la build/*.exe build/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SkywardTales-${{ github.sha }}
          path: |
            build/SkywardTales-Setup.exe
            build/SkywardTales-windows.zip
            build/SkywardTales-linux.zip
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG" build/SkywardTales-Setup.exe build/SkywardTales-windows.zip build/SkywardTales-linux.zip \
            --target "$GITHUB_SHA" --title "Skyward Tales $TAG" --notes-file docs/RELEASE_NOTES.md --prerelease
